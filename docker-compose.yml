services:
  # Base de données MySQL
  db:
    image: mysql:8.0
    container_name: notes_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: notes_db
      MYSQL_USER: notes_user
      MYSQL_PASSWORD: notes_pass_456
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./WS_ETU003103_ETU003248/script/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - notes_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "notes_user", "-pnotes_pass_456"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application API Spring Boot
  api:
    build:
      context: ./WS_ETU003103_ETU003248
      dockerfile: Dockerfile
    container_name: notes_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: notes_db
      DB_USER: notes_user
      DB_PASSWORD: notes_pass_456
      JWT_SECRET: your_super_secret_key_change_this_in_production_123456789
      SERVER_PORT: 8060
    ports:
      - "8060:8060"
    networks:
      - notes_network

  # Application Frontend Vue.js
  frontend:
    build:
      context: ./vue-project
      dockerfile: Dockerfile
    container_name: notes_frontend
    restart: always
    depends_on:
      - api
    ports:
      - "5173:80"
    networks:
      - notes_network
    environment:
      - VITE_API_URL=http://localhost:8060

networks:
  notes_network:
    driver: bridge

volumes:
  db_data:
